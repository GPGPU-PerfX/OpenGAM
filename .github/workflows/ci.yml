# Build OpenGAM on Ubuntu and macOS with the developer entry point, build.sh.

name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            mode: rel
            name: rel
          - os: ubuntu-24.04
            mode: dbg
            name: dbg
          - os: ubuntu-24.04
            mode: dbg_asan
            name: dbg_asan
          - os: macos-latest
            mode: rel
            name: macos-rel
          - os: macos-latest
            mode: dbg
            name: macos-dbg
          - os: macos-latest
            mode: dbg_asan
            name: macos-dbg_asan
    steps:
      - uses: actions/checkout@v4

      - name: Install Ubuntu build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Build
        run: ./build.sh ${{ matrix.mode }}
